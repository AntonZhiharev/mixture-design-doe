# Настройки Streamlit для этого проекта (iter93).
#
# Файл читается как ПРОЕКТНЫЙ конфиг ($CWD/.streamlit/config.toml), поэтому
# приложение нужно запускать из корня репозитория — так и написано в README
# (`streamlit run src/apps/streamlit_app.py`), а лаунчер `run_streamlit_app.py`
# сам переходит в корень (`cwd=HERE`).

[client]
# ПОЧЕМУ viewer: в Streamlit 1.58 горячая клавиша «c» открывает диалог «Clear
# caches», и она гасится ТОЛЬКО когда курсор стоит в поле ввода
# (`Sz(t)` = target внутри INPUT/TEXTAREA/contenteditable). При копировании
# выделенного текста из ответа помощника фокус находится в обычном `div`,
# поэтому Ctrl+C доходил до этого обработчика: сочетание регистрируется и на
# keydown, и на keyup (`{keydown:!0, keyup:!0}`), а на keyup после отпущенного
# Ctrl проверка модификаторов уже проходит — диалог очистки открывался.
#
# `viewer` выключает developer-действия (`G9(...)` → false), то есть и саму
# клавишу «c», и пункты «Rerun»/«Clear caches»/«Deploy» в меню. Для этого
# проекта цена нулевая: кеша Streamlit в коде нет вообще (ни одного
# `st.cache_data`/`st.cache_resource` в `src/`), очищать нечего.
#
# Что ОСТАЁТСЯ: кнопка «Stop» (она рисуется вне этого гейта), перезапуск по
# клавише «r» (у неё гейта нет), а также viewer-действия меню — печать, запись
# экрана, переключение темы.
#
# Вернуть прежнее поведение = сменить значение на "auto" (дефолт Streamlit).
toolbarMode = "viewer"
